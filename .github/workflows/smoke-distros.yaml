name: Smoke test (distros)

# Proves distrofetch installs and reports correctly on distros not developed on. This
# is where /proc layout differences, missing coreutils flags, and — most of all — the
# three package-manager paths in detect_packages get exercised for real.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm --needed git base-devel coreutils
            pkgmgr: pacman
            logo: arch
          - name: debian
            image: debian:stable-slim
            bootstrap: apt-get update && apt-get install -y --no-install-recommends git ca-certificates make coreutils
            pkgmgr: dpkg
            logo: debian
          - name: fedora
            image: fedora:latest
            bootstrap: dnf -y install git make coreutils
            pkgmgr: rpm
            logo: fedora
    steps:
      - name: bootstrap
        run: ${{ matrix.bootstrap }}

      # checkout needs git present, which is why bootstrap runs first.
      - uses: actions/checkout@v5

      - name: install
        run: make install PREFIX=/usr/local

      - name: smoke
        # Explicit, because the default shell inside a container is /bin/sh. On Debian
        # 13 that is dash 0.5.12, which added `set -o pipefail` — so the guard at the
        # top of this script succeeds and the first process substitution fails fifty
        # lines later, which looks like a distrofetch bug rather than a shell mismatch.
        shell: bash
        run: |
          set -euo pipefail
          # Exercise the installed entry point from outside the source tree, so a
          # broken lib/, data/, or logos/ path resolution fails here instead of on a
          # user's machine.
          cd /
          distrofetch --version

          # --- the plain report: one fact per line, the parseable form -------------
          distrofetch --no-art --no-color | tee /tmp/plain.txt

          for label in OS: Kernel: Arch: Uptime: Packages: Shell: CPU: Cores: \
            Clock: Cache: Memory: Swap: Machine: Firmware: Support: Disks: \
            GPU: Network: USB: TBolt:; do
            grep -q "^$label" /tmp/plain.txt \
              || { echo "missing field: $label" >&2; exit 1; }
          done

          # Only the probes must be populated. Released/Machine/Firmware legitimately
          # come back unknown — a release the bundled table does not cover, and a
          # container with no DMI — and asserting otherwise would force the table to
          # be padded with guesses.
          for label in OS: Kernel: Arch: Uptime: Packages: Shell: CPU: Cores: Memory:; do
            if grep "^$label" /tmp/plain.txt | grep -q 'unknown'; then
              echo "probe returned unknown on ${{ matrix.name }}:" >&2
              grep "^$label" /tmp/plain.txt >&2
              exit 1
            fi
          done

          # detect_packages must pick the right backend for this distro.
          grep -q '(${{ matrix.pkgmgr }})' /tmp/plain.txt \
            || { echo "expected ${{ matrix.pkgmgr }} package backend" >&2; exit 1; }

          # --no-art is what anything parsing this output is told to use, so no part
          # of the dashboard may survive it. grep -F, not a bracket expression:
          # containers run in the C locale, where a bracket expression matches bytes,
          # and the header rule U+2500 shares its first two bytes with U+2502.
          if grep -qF -e '│' -e '┌' -e '┐' -e '└' -e '┘' -e '├' -e '┤' /tmp/plain.txt; then
            echo "--no-art emitted frame characters:" >&2
            cat /tmp/plain.txt >&2
            exit 1
          fi

          # --- the dashboard ------------------------------------------------------
          # LINES is pinned so the density system does not condense away the rows
          # these assertions name. A runner has no controlling terminal, so tput
          # would otherwise report the 24-line fallback.
          COLUMNS=160 LINES=90 distrofetch --no-color --no-clear | tee /tmp/dash.txt
          for section in SYSTEM DISTRIBUTION PROCESSOR MEMORY STORAGE MACHINE; do
            grep -q "$section" /tmp/dash.txt \
              || { echo "missing panel: $section" >&2; exit 1; }
          done

          # The logo is picked from ID= in /etc/os-release. A wrong pick is silent
          # otherwise: every distro would still render, just wearing the wrong face.
          # Assert the expected art is present, rather than comparing two whole runs.
          # Comparing runs does not work: a value whose *length* changes between them
          # (uptime rolling over, memory used gaining a digit) shifts that panel's
          # padding, and stripping digits does not strip the spaces.
          #
          # The longest line of the logo is distinctive enough to identify it and is
          # the least likely to collide between distros.
          sig=""
          while IFS= read -r art_line; do
            if [ "${#art_line}" -gt "${#sig}" ]; then
              sig="$art_line"
            fi
          done < "/usr/local/lib/distrofetch/logos/${{ matrix.logo }}.txt"
          [ -n "$sig" ] || { echo "logo file for ${{ matrix.logo }} is empty" >&2; exit 1; }

          grep -qF -- "$sig" /tmp/dash.txt \
            || { echo "auto-selected logo is not ${{ matrix.logo }}" >&2; exit 1; }

          # Every panel border must land in the same column or the grid shears.
          #
          # The box characters are translated to ASCII first, one sed expression per
          # character. Measuring them directly does not work: containers run in the C
          # locale, where awk's length() counts bytes, and a full-width panel row
          # carries two three-byte borders where a paired row carries four. Those rows
          # are the same width on screen and differ by four bytes, so a byte-wise
          # check reports a shear that is not there.
          COLUMNS=160 LINES=90 distrofetch --no-color --no-clear \
            | sed -e 's/│/|/g' -e 's/┌/+/g' -e 's/┐/+/g' -e 's/└/+/g' \
                  -e 's/┘/+/g' -e 's/├/+/g' -e 's/┤/+/g' -e 's/─/-/g' \
            > /tmp/flat.txt
          first=""
          while IFS= read -r line; do
            case "$line" in *'|'*) ;; *) continue ;; esac
            # Safe now: everything left is ASCII, so ${#} is the display width.
            if [ -z "$first" ]; then first="${#line}"; fi
            if [ "${#line}" -ne "$first" ]; then
              echo "ragged panel edge: ${#line} vs $first" >&2
              exit 1
            fi
          done < /tmp/flat.txt
          [ -n "$first" ] || { echo "no panel lines found" >&2; exit 1; }

          # --- processor generation -----------------------------------------------
          # The value is not asserted: these runners are Xeon and EPYC parts, which do
          # not sit on the consumer generation ladder and correctly report so. What
          # must hold is that both rows are present and neither says "unknown" where a
          # sentence belongs.
          for row in Generation Currency 'Micro-arch'; do
            grep -q "$row" /tmp/dash.txt \
              || { echo "processor panel missing row: $row" >&2; exit 1; }
          done

          # The vendor mark lives in the panel's gutter. Every x86 runner is Intel or
          # AMD, so one of those two must appear rather than the generic chip.
          if ! grep -qF -e '|_|_| |_|' -e '/_/ \_\_|' /tmp/dash.txt; then
            echo "no Intel or AMD mark in the processor panel" >&2
            sed -n '/PROCESSOR/,/^ *└/p' /tmp/dash.txt >&2
            exit 1
          fi

          # --- devices ------------------------------------------------------------
          # Values are not asserted: a runner is a VM with no display adapter, one
          # virtio NIC, and no Thunderbolt. What must hold is that each panel renders
          # and reaches a definite answer — "none present" is a fact, a blank row is a
          # bug, and "unknown" would be neither.
          for section in GRAPHICS NETWORK PERIPHERALS STORAGE; do
            grep -q "$section" /tmp/dash.txt \
              || { echo "missing panel: $section" >&2; exit 1; }
          done

          for row in 'GPU' 'USB' 'Thunderbolt'; do
            grep -q "$row" /tmp/dash.txt \
              || { echo "device panel missing row: $row" >&2; exit 1; }
          done

          # A MAC address is a durable unique identifier for the machine and this
          # output is designed to be posted. Check the real interfaces on this runner,
          # not a fixture: the unit tests cover the fixture.
          for mac in $(cat /sys/class/net/*/address 2>/dev/null | sort -u); do
            case "$mac" in
              00:00:00:00:00:00 | '') continue ;;
            esac
            if grep -qF "$mac" /tmp/dash.txt /tmp/plain.txt; then
              echo "a MAC address reached the output: $mac" >&2
              exit 1
            fi
          done

          # --- no hidden text -----------------------------------------------------
          # Values wrap; they are never truncated. An ellipsis in the output means a
          # fact was thrown away, which is the failure this replaced.
          for w in 60 80 100 140 200; do
            if COLUMNS=$w LINES=90 distrofetch --no-color --no-clear | grep -q '\.\.\.'; then
              echo "output was truncated at COLUMNS=$w" >&2
              exit 1
            fi
          done

          # --- fitting the terminal -----------------------------------------------
          # Only with --fit, and only as far as wrapping allows: a condensed panel is
          # taller than a clipped one, so this checks the heights where it can succeed.
          for h in 90 70; do
            n="$(COLUMNS=160 LINES=$h distrofetch --no-color --no-clear --fit | wc -l)"
            if [ "$n" -gt $((h - 1)) ]; then
              echo "--fit at LINES=$h emitted $n lines and did not fit" >&2
              exit 1
            fi
          done

          # Both themes have to render; a broken palette is a broken dashboard.
          for theme in vivid matrix; do
            COLUMNS=160 LINES=90 distrofetch --theme=$theme --no-clear >/dev/null \
              || { echo "theme $theme failed" >&2; exit 1; }
          done

          # Progress output is a terminal affordance and must never reach a pipe.
          if COLUMNS=160 distrofetch --no-color | grep -q 'reading '; then
            echo "progress output reached a pipe" >&2
            exit 1
          fi

          # Clearing the screen writes an escape sequence, and this is not a terminal.
          if COLUMNS=140 distrofetch --no-color | grep -q '\[2J'; then
            echo "screen-clear escape reached a pipe" >&2
            exit 1
          fi

          # --- memory modules -----------------------------------------------------
          # Unprivileged runs must explain themselves rather than printing "unknown",
          # which reads as a failed probe. Containers have no SMBIOS access at all.
          grep -q -e 'needs root' -e 'no SMBIOS' -e 'no memory device' -e 'DIMM' \
            /tmp/dash.txt \
            || { echo "memory panel said nothing about modules" >&2; exit 1; }
