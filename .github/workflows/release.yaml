name: Release

# Tag with `git tag -s vX.Y.Z && git push --tags` only after CI is green on the commit
# being tagged. A tag is not easily unpublished.
#
# Bump DISTROFETCH_VERSION in bin/distrofetch first — the guard below refuses to
# release if the tag and the script disagree.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history

      - name: verify tag matches DISTROFETCH_VERSION
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          script="$(make version)"
          if [ "$tag" != "$script" ]; then
            echo "tag v$tag does not match bin/distrofetch ($script)" >&2
            exit 1
          fi

      - name: build artifacts
        run: make dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
