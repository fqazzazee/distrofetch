name: Release

# Tag with `git tag -s vX.Y.Z && git push --tags` only after CI is green on the commit
# being tagged. A tag is not easily unpublished.
#
# Bump DISTROFETCH_VERSION in bin/distrofetch first — the guard below refuses to
# release if the tag and the script disagree.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # release notes are generated from history
          # This is the one job with contents: write. The release is published with an
          # explicit token below rather than whatever checkout left in .git/config.
          persist-credentials: false

      - name: verify tag matches DISTROFETCH_VERSION
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          script="$(make version)"
          if [ "$tag" != "$script" ]; then
            echo "tag v$tag does not match bin/distrofetch ($script)" >&2
            exit 1
          fi

      - name: build artifacts
        run: make dist

      # `gh release` rather than a third-party action. This job is the only one in the
      # repository that holds a write token, so it is the one place where a supply-chain
      # compromise would cost something — and gh is already on the runner, so the action
      # was buying nothing but an extra dependency in exactly the wrong job.
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256
