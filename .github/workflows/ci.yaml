name: CI

# Minimal CI: lint, format check, tests. Every job shells out to the same make target
# a developer runs locally, so CI confirms rather than discovers.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # No job here pushes, so the checkout has no use for a token in
          # .git/config where later steps — and anything they run — can read it.
          persist-credentials: false
      # shellcheck ships preinstalled on the ubuntu-latest image.
      - run: make lint

  format:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # No job here pushes, so the checkout has no use for a token in
          # .git/config where later steps — and anything they run — can read it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      # Pinned: an unpinned shfmt turns a formatting release into a red build.
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
      - run: make fmt-check

  test:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # No job here pushes, so the checkout has no use for a token in
          # .git/config where later steps — and anything they run — can read it.
          persist-credentials: false
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: make test
