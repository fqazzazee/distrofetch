name: CI

# Minimal CI: lint, format check, tests. Every job shells out to the same make target
# a developer runs locally, so CI confirms rather than discovers.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on the ubuntu-latest image.
      - run: make lint

  format:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Pinned: an unpinned shfmt turns a formatting release into a red build.
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
      - run: make fmt-check

  test:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: make test
