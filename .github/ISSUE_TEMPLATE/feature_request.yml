name: Feature request
description: Suggest something this should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](../blob/main/ROADMAP.md) and the non-goals in
        [SPEC.md](../blob/main/SPEC.md) first — it may already be planned, or
        deliberately out of scope.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Roughly how it would work. A sketch of the output helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are using now, and why they are not enough.
